name: intern-watch

on:
  schedule:
    # Every 5 hours. (GitHub can delay this under load, see the note below.)
    - cron: "0 */5 * * *"
  workflow_dispatch:        # manual run button in the Actions tab
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options: [normal, seed, faang-only, dry-run, readme]

# write permission so state.json can be committed back to the repo
permissions:
  contents: write

concurrency:
  group: intern-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          # state.json is kept in the repo root
          INTERN_WATCH_HOME: ${{ github.workspace }}/state

          # --- Notifications (from GitHub Secrets) ---
          NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_FAANG: ${{ secrets.NTFY_TOPIC_FAANG }}
          NTFY_SERVER:      ${{ secrets.NTFY_SERVER }}

          # --- Email (optional) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL:  ${{ secrets.TO_EMAIL }}

          # --- Filters (from Variables; defaults otherwise) ---
          SEASONS:             ${{ vars.SEASONS             || '2027' }}
          REGIONS:             ${{ vars.REGIONS             || 'all' }}
          CATEGORIES:          ${{ vars.CATEGORIES          || '' }}
          EXCLUDE_SPONSORSHIP: ${{ vars.EXCLUDE_SPONSORSHIP || 'no-sponsorship,citizens-only' }}
          EXCLUDE_REGIONS:     ${{ vars.EXCLUDE_REGIONS     || 'middle-east,africa,south-asia' }}
          MAX_AGE_DAYS:        ${{ vars.MAX_AGE_DAYS        || '30' }}
          TITLE_EXCLUDE:       ${{ vars.TITLE_EXCLUDE       || 'phd,ph.d,masters,master''s,mba' }}
          NTFY_MAX_PER_RUN:    ${{ vars.NTFY_MAX_PER_RUN    || '12' }}

          # --- README listing tables ---
          README_MAX_ROWS:     ${{ vars.README_MAX_ROWS     || '150' }}
        run: |
          case "${{ inputs.mode }}" in
            seed)       FLAG="--seed" ;;
            faang-only) FLAG="--faang-only" ;;
            dry-run)    FLAG="--dry-run" ;;
            readme)     FLAG="--readme" ;;
            *)          FLAG="" ;;
          esac
          python3 intern_watch.py $FLAG

      - name: Save seen listings and README tables
        run: |
          if [ -n "$(git status --porcelain state/ README.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/ README.md
            git commit -m "listings: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # retry with rebase if concurrent runs conflict
            git pull --rebase --autostash || true
            git push || echo "push failed, will retry on the next run"
          else
            echo "No new listings, state and README unchanged."
          fi
